<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t-employee d-employee">
<title id="t-employee">LeaveFlow employee journey</title>
<desc id="d-employee">1. Sign in: Email and password Cognito, 15-min session; 2. Overview: Available balance and upcoming leave; 3. New request: Live working-day count skips public holidays; 4. Policy check: Notice, blackout dates, overlap and balance; 5. Submitted: Days placed on hold, manager notified; 6. Track status: Timeline and alerts, withdraw while pending; 7. Decision: Approved: days deducted Rejected: hold released; 8. Cancel: Allowed before the start date: refunded</desc>
