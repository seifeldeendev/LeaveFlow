<title id="t-hr">LeaveFlow hr administrator journey</title>
<desc id="d-hr">1. Sign in: Password and authenticator code; 2. HR queue: Second steps and escalated requests; 3. Final decision: Approve or reject; employee notified; 4. All balances: Every employee, with CSV export; 5. Ledger: Full history per employee, append-only; 6. Adjustment: Up to 10 days with a reason, audited; 7. Accrual run: Monthly accrual and the casual grant; 8. Year end: Carry-over and expiry of balances</desc>
