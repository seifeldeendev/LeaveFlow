<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t-manager d-manager">
<title id="t-manager">LeaveFlow manager journey</title>
<desc id="d-manager">1. Sign in: Password and authenticator code; 2. Approval queue: Requests from my team, never my own; 3. Review: Dates, type, reason and team calendar; 4. Coverage check: Share of team away; blocked above 30%; 5. Decide: Approve, or reject with a comment; 6. Route: Over 5 days or Unpaid goes to HR as step 2; 7. Escalation: Undecided after 48 h moves to HR; 8. History: My decisions and the team calendar</desc>
